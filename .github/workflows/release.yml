name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must match manifest.json and the newest CHANGELOG section (e.g. 0.2.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify the requested version matches the manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          manifest_version="$(python3 -c 'import json; print(json.load(open("custom_components/bubble_climate_scheduler/manifest.json"))["version"])')"
          if [ "$VERSION" != "$manifest_version" ]; then
            echo "::error::Requested version $VERSION does not match manifest version $manifest_version. Update custom_components/bubble_climate_scheduler/manifest.json and CHANGELOG.md first."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run the test suite
        run: |
          npm test
          python3 -m unittest discover -s tests_backend

      - name: Extract the release notes from the CHANGELOG
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          python3 - "$VERSION" <<'EOF' > release-notes.md
          import re
          import sys

          version = sys.argv[1]
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## v{re.escape(version)}\s*\n(.*?)(?=^## v|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if not match:
              sys.exit(f"CHANGELOG.md has no '## v{version}' section")
          sys.stdout.write(match.group(1).rstrip() + "\n")
          EOF

      - name: Create the tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          python3 -m zipfile -c "bubble-climate-scheduler-${VERSION}.zip" custom_components/bubble_climate_scheduler/
          gh release create "v${VERSION}" \
            "bubble-climate-scheduler-${VERSION}.zip" \
            --title "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md
